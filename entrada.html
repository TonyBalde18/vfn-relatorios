<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<!--
  Entrada da app instalada (PWA, manifest.json → start_url): encaminha pelo papel da sessão guardada.
  admin → index.html · treinador/dirigente → dashboard.html · jogador → equipa.html · sem sessão → public.html
  As outras páginas, ao abrirem em modo standalone pela primeira vez, passam por aqui (o iPhone usa o URL
  de onde a app foi instalada e ignora o start_url).
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<title>HUB VFN</title>
<link rel="icon" href="assets/logo-icon.ico">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HUB VFN">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0A1628; color: #FFD700; font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  img { width: 120px; height: 120px; object-fit: contain; }
  span { font-weight: 800; letter-spacing: .04em; font-size: .95rem; }
</style>
</head>
<body>
<img src="assets/logo.png" alt="ACD Vila Franca das Naves">
<span>HUB VFN</span>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=35"></script>
<script src="js/core/shared.js?v=35"></script>
<script>
(function () {
  var destino = { admin: "index.html", treinador: "dashboard.html", dirigente: "dashboard.html", jogador: "equipa.html" };
  var feito = false;
  function ir(pagina) {
    if (feito) return;
    feito = true;
    try { sessionStorage.setItem("vfnPwa", "1"); } catch (e) {}
    location.replace(pagina);
  }
  setTimeout(function () { ir("public.html"); }, 8000); // sem rede / Supabase lento: a página pública
  (async function () {
    try {
      var cliente = window.VFN && VFN.criarClienteSupabase();
      if (!cliente) return ir("public.html");
      var sessao = (await cliente.auth.getSession()).data.session;
      if (!sessao) return ir("public.html");
      var a = await VFN.acessoDoUtilizador(cliente, sessao.user);
      ir(destino[a.papel] || "public.html");
    } catch (e) { ir("public.html"); }
  })();
})();
</script>
</body>
</html>
